<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anúncios - Controle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { user-select: none; }
    </style>
</head>
<body class="bg-gray-950 text-white flex flex-col h-screen overflow-hidden">

    <nav class="bg-gray-900 shrink-0 flex items-center gap-3 px-4 py-2 border-b border-gray-700 text-sm">
        <a href="index.html" class="text-gray-400 hover:text-yellow-400 font-bold transition">⚙️ CONFIG</a>
        <a id="link-jogo" href="controle.html" class="text-gray-400 hover:text-yellow-400 font-bold transition">▶️ JOGO</a>
        <span class="text-purple-400 font-black tracking-wider">📺 ANÚNCIOS</span>
    </nav>

    <!-- Área principal -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden">

        <!-- Coluna esquerda: vídeos disponíveis -->
        <div class="flex-1 flex flex-col border-r border-gray-700 overflow-hidden">
            <div class="flex items-center justify-between px-4 py-3 border-b border-gray-800 shrink-0 gap-2">
                <h2 class="font-black text-gray-300 uppercase tracking-wider text-sm">Vídeos disponíveis</h2>
                <div class="flex items-center gap-2">
                    <span id="status-upload-video" class="text-xs text-purple-300"></span>
                    <label class="text-xs bg-purple-800 hover:bg-purple-700 active:scale-95 text-white px-3 py-1.5 rounded-lg transition-transform font-bold cursor-pointer">
                        ⬆ Enviar vídeo
                        <input type="file" accept=".mp4,.webm,.mov,.avi,.mkv" multiple class="hidden" onchange="enviarArquivos('video', this)">
                    </label>
                    <button onclick="carregarVideos()" class="text-xs bg-gray-800 hover:bg-gray-700 active:scale-95 text-gray-300 px-3 py-1.5 rounded-lg transition-transform font-bold">🔄 Recarregar</button>
                </div>
            </div>

            <div id="lista-videos" class="flex-1 overflow-y-auto p-3 space-y-2">
                <p class="text-gray-500 text-sm text-center mt-8">Carregando...</p>
            </div>
        </div>

        <!-- Coluna direita: fila de reprodução -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <div class="flex items-center justify-between px-4 py-3 border-b border-gray-800 shrink-0">
                <h2 class="font-black text-gray-300 uppercase tracking-wider text-sm">Fila de reprodução</h2>
                <button onclick="limparFila()" class="text-xs bg-gray-800 hover:bg-gray-700 active:scale-95 text-gray-400 px-3 py-1.5 rounded-lg transition-transform font-bold">🗑 Limpar</button>
            </div>

            <div id="fila-reprodução" class="flex-1 overflow-y-auto p-3 space-y-2">
                <p id="fila-vazia" class="text-gray-600 text-sm text-center mt-8">Nenhum vídeo na fila.<br>Adicione vídeos da lista ao lado.</p>
            </div>
        </div>
    </div>

    <!-- Patrocinadores do carrossel do telão -->
    <div class="shrink-0 bg-gray-900/60 border-t border-gray-700 px-4 py-3">
        <div class="flex items-center justify-between mb-2 gap-2">
            <h2 class="font-black text-gray-300 uppercase tracking-wider text-sm">📣 Patrocinadores (carrossel do telão)</h2>
            <div class="flex items-center gap-2">
                <span id="status-upload-patrocinador" class="text-xs text-purple-300"></span>
                <label class="text-xs bg-purple-800 hover:bg-purple-700 active:scale-95 text-white px-3 py-1.5 rounded-lg transition-transform font-bold cursor-pointer">
                    ⬆ Enviar logo
                    <input type="file" accept="image/*" multiple class="hidden" onchange="enviarArquivos('patrocinador', this)">
                </label>
            </div>
        </div>
        <div id="lista-patrocinadores" class="flex gap-3 overflow-x-auto pb-1">
            <p class="text-gray-600 text-sm">Carregando...</p>
        </div>
    </div>

    <!-- Rodapé: ações -->
    <div class="shrink-0 bg-gray-900 border-t border-gray-700 p-4 flex gap-3" style="padding-bottom:100px;">
        <label class="flex items-center gap-2 bg-gray-800 hover:bg-gray-700 active:scale-95 px-5 rounded-xl cursor-pointer transition-transform select-none border border-gray-700">
            <input type="checkbox" id="loop-fila" class="w-5 h-5 accent-purple-600">
            <span class="text-gray-300 font-black text-sm">🔁 LOOP</span>
        </label>
        <button onclick="reproduzirFila()" class="flex-1 bg-purple-700 hover:bg-purple-600 active:scale-95 text-white font-black py-4 rounded-xl text-lg shadow-lg transition-transform">▶ REPRODUZIR FILA</button>
        <button onclick="pararVideo()" class="bg-red-800 hover:bg-red-700 active:scale-95 text-white font-black py-4 px-6 rounded-xl text-lg shadow-lg transition-transform">⏹ PARAR</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let fila = [];

        const mapaControle = { futsal: 'controle_futsal.html', basquete: 'controle_basquete.html', volei: 'controle_volei.html' };
        socket.on('atualizar_tela', (dados) => {
            const link = document.getElementById('link-jogo');
            if (link && mapaControle[dados.esporte]) link.href = mapaControle[dados.esporte];
            renderPatrocinadores(dados.patrocinadores || []);
        });

        // ---- Upload de arquivos (vídeos e logos de patrocinadores) ----
        async function enviarArquivos(tipo, input) {
            const files = Array.from(input.files || []);
            input.value = '';
            if (files.length === 0) return;
            const status = document.getElementById('status-upload-' + tipo);
            for (let i = 0; i < files.length; i++) {
                const f = files[i];
                status.textContent = `Enviando ${i + 1}/${files.length}: ${f.name}...`;
                try {
                    const resp = await fetch(`/api/upload/${tipo}?nome=${encodeURIComponent(f.name)}`, { method: 'POST', body: f });
                    if (!resp.ok) {
                        const erro = await resp.json().catch(() => ({}));
                        alert(`Falha ao enviar "${f.name}": ${erro.erro || 'erro ' + resp.status}`);
                    }
                } catch (e) {
                    alert(`Falha ao enviar "${f.name}": ${e.message}`);
                }
            }
            status.textContent = '';
        }

        async function excluirArquivo(tipo, nome, rotulo) {
            if (!confirm(`Excluir ${rotulo} "${nome}" do servidor? Essa ação não pode ser desfeita.`)) return;
            const resp = await fetch(`/api/${tipo}/${encodeURIComponent(nome)}`, { method: 'DELETE' });
            if (!resp.ok) {
                const erro = await resp.json().catch(() => ({}));
                alert(`Falha ao excluir: ${erro.erro || 'erro ' + resp.status}`);
                return;
            }
            if (tipo === 'video') {
                fila = fila.filter(n => n !== nome); // tira da fila local também
                renderizarFila();
            }
        }

        // ---- Patrocinadores (renderizados a partir do estado broadcast) ----
        let patrocinadoresAssinatura = null;
        function renderPatrocinadores(lista) {
            const assinatura = lista.join('|');
            if (assinatura === patrocinadoresAssinatura) return;
            patrocinadoresAssinatura = assinatura;

            const container = document.getElementById('lista-patrocinadores');
            if (lista.length === 0) {
                container.innerHTML = '<p class="text-gray-600 text-sm">Nenhuma logo no servidor — o carrossel fica oculto no telão.</p>';
                return;
            }
            container.innerHTML = '';
            lista.forEach(nome => {
                const card = document.createElement('div');
                card.className = 'relative shrink-0 bg-gray-800 border border-gray-700 rounded-xl p-2 w-28 flex flex-col items-center gap-1';
                card.innerHTML = `
                    <img src="/patrocinadores/${encodeURIComponent(nome)}" alt="" class="h-10 w-full object-contain bg-white/90 rounded">
                    <span class="text-[10px] text-gray-400 truncate w-full text-center">${nome.replace(/</g, '&lt;')}</span>
                    <button onclick="excluirArquivo('patrocinador', '${nome.replace(/'/g, "\\'")}', 'a logo')"
                        class="absolute -top-1.5 -right-1.5 w-6 h-6 bg-red-600 hover:bg-red-500 text-white rounded-full font-bold leading-none text-sm shadow">×</button>`;
                container.appendChild(card);
            });
        }

        function carregarVideos() {
            document.getElementById('lista-videos').innerHTML = '<p class="text-gray-500 text-sm text-center mt-8">Carregando...</p>';
            socket.emit('solicitar_videos');
        }

        socket.on('lista_videos', (videos) => {
            const lista = document.getElementById('lista-videos');
            if (videos.length === 0) {
                lista.innerHTML = '<p class="text-gray-500 text-sm text-center mt-8">Nenhum vídeo encontrado em <code class="text-gray-400">public/videos/</code></p>';
                return;
            }
            lista.innerHTML = '';
            videos.forEach(nome => {
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between bg-gray-800 hover:bg-gray-750 rounded-xl px-4 py-3 gap-3 border border-gray-700';
                div.innerHTML = `
                    <span class="text-sm text-gray-200 truncate flex-1">📹 ${nome}</span>
                    <button onclick="adicionarNaFila('${nome.replace(/'/g, "\\'")}')"
                        class="shrink-0 bg-purple-700 hover:bg-purple-600 active:scale-95 text-white font-bold px-3 py-1.5 rounded-lg text-sm transition-transform">
                        + Adicionar
                    </button>
                    <button onclick="excluirArquivo('video', '${nome.replace(/'/g, "\\'")}', 'o vídeo')"
                        class="shrink-0 text-gray-500 hover:text-red-400 active:scale-95 font-bold px-2 py-1.5 rounded-lg text-sm transition-transform" title="Excluir do servidor">🗑</button>`;
                lista.appendChild(div);
            });
        });

        function adicionarNaFila(nome) {
            fila.push(nome);
            renderizarFila();
        }

        function removerDaFila(index) {
            fila.splice(index, 1);
            renderizarFila();
        }

        function limparFila() {
            fila = [];
            renderizarFila();
        }

        function renderizarFila() {
            const container = document.getElementById('fila-reprodução');
            const placeholder = document.getElementById('fila-vazia');

            if (fila.length === 0) {
                container.innerHTML = '<p id="fila-vazia" class="text-gray-600 text-sm text-center mt-8">Nenhum vídeo na fila.<br>Adicione vídeos da lista ao lado.</p>';
                return;
            }

            container.innerHTML = '';
            fila.forEach((nome, i) => {
                const div = document.createElement('div');
                div.className = 'flex items-center gap-3 bg-gray-800 rounded-xl px-4 py-3 border border-gray-700';
                div.innerHTML = `
                    <span class="text-purple-400 font-black font-mono w-6 text-center shrink-0">${i + 1}</span>
                    <span class="text-sm text-gray-200 truncate flex-1">📹 ${nome}</span>
                    <button onclick="removerDaFila(${i})"
                        class="shrink-0 text-gray-500 hover:text-red-400 active:scale-95 font-bold px-2 py-1 rounded-lg text-lg transition-transform leading-none">×</button>`;
                container.appendChild(div);
            });
        }

        function reproduzirFila() {
            if (fila.length === 0) {
                alert('A fila está vazia. Adicione vídeos antes de reproduzir.');
                return;
            }
            const loop = document.getElementById('loop-fila').checked;
            socket.emit('comando_video', { acao: 'playlist', arquivos: [...fila], loop });
        }

        function pararVideo() {
            socket.emit('comando_video', { acao: 'stop' });
        }

        carregarVideos();
    </script>
</body>
</html>
