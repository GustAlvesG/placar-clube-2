<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controle - Vôlei</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        .font-digital { font-family: 'Share Tech Mono', monospace; }
        body { user-select: none; height: 100vh; height: 100dvh; }
    </style>
</head>
<body class="bg-gray-900 text-white w-full flex flex-col overflow-hidden">

    <nav class="bg-gray-900 shrink-0 flex items-center gap-3 px-4 py-2 border-b border-gray-700 text-sm">
        <a href="index.html" class="text-gray-400 hover:text-yellow-400 font-bold transition">⚙️ CONFIG</a>
        <span class="text-blue-300 font-black tracking-wider">🏐 VÔLEI</span>
        <span id="badge-integracao" class="hidden px-2 py-1 rounded-lg font-black tracking-wider text-[10px]"></span>
        <a href="controle_anuncios.html" class="ml-auto text-gray-400 hover:text-yellow-400 font-bold transition">📺 ANÚNCIOS</a>
    </nav>

    <div class="flex-1 min-h-0 flex flex-row p-2 gap-2 overflow-hidden">

        <!-- TIME A -->
        <div class="flex-1 bg-gray-800 rounded-3xl p-2 flex flex-col border-4 border-blue-900 shadow-2xl">
            <div class="w-full flex flex-col items-center gap-1.5">
                <h2 id="nome-a" class="text-base font-bold text-blue-400 tracking-widest uppercase text-center">TIME A</h2>
                <div class="bg-black w-full rounded-2xl py-2 flex justify-center items-center shadow-inner">
                    <span id="score-a" class="font-digital text-5xl md:text-6xl text-blue-500 leading-none">0</span>
                </div>
                <button onclick="marcar('timeA')" class="w-full bg-blue-600 active:bg-blue-400 active:scale-95 text-white text-xl font-black py-3 rounded-2xl shadow-lg transition-transform">+1 PONTO</button>
                <button onclick="cmdPlacar('timeA', 'sub_ponto', 1)" class="w-full bg-blue-900 active:bg-blue-800 active:scale-95 text-blue-300 text-sm font-bold py-1.5 rounded-xl transition-transform">−1</button>
            </div>
            <!-- Sets vencidos — só leitura. Quem fecha o set é o botão da barra
                 de baixo, que aparece quando a pontuação fecha a parcial. -->
            <div class="w-full mt-auto pt-2">
                <div class="text-center text-blue-400 text-sm font-bold">
                    Sets: <span id="sets-a" class="text-white text-2xl font-digital">0</span>
                </div>
            </div>
        </div>

        <!-- CENTRO -->
        <div class="w-28 md:w-40 bg-gray-950 flex flex-col items-center justify-center gap-2 p-2 rounded-3xl border border-gray-700 overflow-hidden">

            <!-- Cronômetro crescente -->
            <div class="bg-black rounded-2xl w-full flex items-center justify-center py-3 border border-gray-700">
                <span id="timer-display" class="font-digital text-2xl md:text-3xl text-yellow-400 leading-none">00:00</span>
            </div>
            <button onclick="cmdCronometro('play')" class="w-full bg-green-700 active:bg-green-600 active:scale-95 text-white font-black py-3 rounded-xl text-sm transition-transform">▶ PLAY</button>
            <button onclick="cmdCronometro('pause')" class="w-full bg-yellow-700 active:bg-yellow-600 active:scale-95 text-white font-black py-3 rounded-xl text-sm transition-transform">⏸ PAUSA</button>

            <!-- Indicador de saque -->
            <!-- <div class="w-full border-t border-gray-700 pt-3">
                <div class="text-xs text-gray-400 font-bold uppercase tracking-widest text-center mb-2">Sacando</div>
                <div class="flex flex-col gap-2 w-full">
                    <button onclick="setSaque('timeA')" id="btn-saque-a" class="w-full bg-blue-800 active:bg-blue-600 active:scale-95 text-blue-200 font-bold py-2 rounded-xl text-xs transition-transform border-2 border-transparent">◀ TIME A</button>
                    <button onclick="setSaque(null)" class="w-full bg-gray-700 active:bg-gray-600 active:scale-95 text-gray-300 font-bold py-2 rounded-xl text-xs transition-transform">nenhum</button>
                    <button onclick="setSaque('timeB')" id="btn-saque-b" class="w-full bg-red-800 active:bg-red-600 active:scale-95 text-red-200 font-bold py-2 rounded-xl text-xs transition-transform border-2 border-transparent">TIME B ▶</button>
                </div>
            </div> -->

            <!-- Zerar -->
            <button onclick="zerarTudo()" class="w-full bg-red-950 active:bg-red-900 active:scale-95 text-red-400 font-bold py-2 rounded-xl text-xs border border-red-800 transition-transform">⚠ ZERAR</button>

            <button onclick="pararTransmissao()" class="w-full bg-gray-800 active:bg-gray-700 active:scale-95 text-gray-300 font-bold py-2 rounded-xl text-xs border border-gray-600 transition-transform">⏹ PARAR TRANSM.</button>
        </div>

        <!-- TIME B -->
        <div class="flex-1 bg-gray-800 rounded-3xl p-2 flex flex-col border-4 border-red-900 shadow-2xl">
            <div class="w-full flex flex-col items-center gap-1.5">
                <h2 id="nome-b" class="text-base font-bold text-red-400 tracking-widest uppercase text-center">TIME B</h2>
                <div class="bg-black w-full rounded-2xl py-2 flex justify-center items-center shadow-inner">
                    <span id="score-b" class="font-digital text-5xl md:text-6xl text-red-500 leading-none">0</span>
                </div>
                <button onclick="marcar('timeB')" class="w-full bg-red-600 active:bg-red-400 active:scale-95 text-white text-xl font-black py-3 rounded-2xl shadow-lg transition-transform">+1 PONTO</button>
                <button onclick="cmdPlacar('timeB', 'sub_ponto', 1)" class="w-full bg-red-900 active:bg-red-800 active:scale-95 text-red-300 text-sm font-bold py-1.5 rounded-xl transition-transform">−1</button>
            </div>
            <!-- Sets vencidos — só leitura (ver comentário no time A) -->
            <div class="w-full mt-auto pt-2">
                <div class="text-center text-red-400 text-sm font-bold">
                    Sets: <span id="sets-b" class="text-white text-2xl font-digital">0</span>
                </div>
            </div>
        </div>

    </div>

    <!-- BARRA DE SET: histórico das parciais + fechamento manual.
         O botão de fechar só aparece quando a pontuação fecha o set (25, ou 15
         no tie-break, com 2 de vantagem) — quem decide é sempre o operador. -->
    <div class="shrink-0 border-t border-gray-700 bg-gray-950 px-3 py-2 flex items-center gap-3">
        <div id="parciais-mesa" class="flex items-center gap-1.5 overflow-x-auto text-xs font-digital text-gray-400 shrink-0"></div>

        <button id="btn-fechar-set" onclick="fecharSet()" class="hidden flex-1 bg-emerald-600 active:bg-emerald-500 active:scale-95 text-white font-black py-3 rounded-2xl shadow-lg transition-transform text-base">
            ✔ FECHAR SET <span id="btn-fechar-set-detalhe" class="font-normal text-emerald-100 text-sm"></span>
        </button>
        <div id="aviso-set" class="flex-1 text-center text-gray-600 text-xs font-bold uppercase tracking-widest"></div>

        <button id="btn-reabrir-set" onclick="reabrirSet()" class="hidden shrink-0 bg-gray-800 active:bg-gray-700 active:scale-95 text-gray-300 font-bold px-3 py-3 rounded-xl text-xs border border-gray-600 transition-transform">↩ REABRIR</button>
    </div>

    <!-- Modal de seleção de jogador -->
    <div id="modal-jogador" class="hidden fixed inset-0 z-50 bg-black/80 flex flex-col">
        <div class="shrink-0 p-4 border-b border-gray-700 bg-gray-900">
            <p id="modal-titulo" class="text-center text-white font-black text-xl"></p>
        </div>
        <div id="modal-lista" class="flex-1 overflow-y-auto p-4 grid grid-cols-3 gap-3 content-start"></div>
        <div class="shrink-0 p-4 border-t border-gray-700 bg-gray-900">
            <button onclick="confirmarSemJogador()" class="w-full bg-gray-700 active:bg-gray-600 active:scale-95 text-gray-200 font-bold py-4 rounded-xl text-lg transition-transform">
                Sem jogador específico
            </button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let estadoAtual = null;
        let pendingAcao = null;

        // Status da fila de eventos da integração com a API do Placar Clube
        // (placarEventos.js, via server.js) — só reflete o broadcast do servidor.
        socket.on('integracao_status', (integracao) => {
            const badge = document.getElementById('badge-integracao');
            if (!integracao.configurada || !integracao.jogoId) { badge.classList.add('hidden'); return; }
            badge.classList.remove('hidden');
            const cores = { sincronizado: 'bg-emerald-900 text-emerald-300', carregado: 'bg-emerald-900 text-emerald-300', sincronizando: 'bg-yellow-900 text-yellow-300' };
            badge.className = `px-2 py-1 rounded-lg font-black tracking-wider text-[10px] ${cores[integracao.statusConexao] || 'bg-red-900 text-red-300'}`;
            badge.innerText = `🔗 #${integracao.jogoId}` + (integracao.pendentes ? ` · ${integracao.pendentes} pend.` : ' · ok');
        });

        socket.on('integracao_eventos_rejeitados', (rejeitados) => {
            alert(`A API do Placar Clube rejeitou ${rejeitados.length} evento(s):\n` + rejeitados.map(r => `• ${r.motivo}`).join('\n'));
        });

        socket.on('atualizar_tela', (dados) => {
            if (dados.serverTime && dados.cronometro) {
                const clockOffset = Date.now() - dados.serverTime;
                dados.cronometro.inicioTimestamp += clockOffset;
            }
            //Checar se existe um esporte, se nao, voltar para a tela de escolha

            estadoAtual = dados;
            document.getElementById('nome-a').innerText = dados.timeA.nome || 'TIME A';
            document.getElementById('nome-b').innerText = dados.timeB.nome || 'TIME B';
            document.getElementById('score-a').innerText = dados.timeA.placar;
            document.getElementById('score-b').innerText = dados.timeB.placar;
            document.getElementById('sets-a').innerText = dados.timeA.sets;
            document.getElementById('sets-b').innerText = dados.timeB.sets;
            atualizarBarraSet(dados);
        });

        // `parcialFechavel` e `parcialAtual` vêm calculados do servidor
        // (gameLogic.parcialFechavel) — a regra do 25/15 com 2 de vantagem não é
        // duplicada aqui.
        function atualizarBarraSet(dados) {
            const fechavel = !!dados.parcialFechavel;
            const parciais = Array.isArray(dados.parciais) ? dados.parciais : [];

            document.getElementById('btn-fechar-set').classList.toggle('hidden', !fechavel);
            const aviso = document.getElementById('aviso-set');
            aviso.classList.toggle('hidden', fechavel);
            aviso.innerText = `${dados.parcialAtual || 1}º set em andamento`;

            if (fechavel) {
                const vencedor = dados.timeA.placar > dados.timeB.placar ? dados.timeA.nome : dados.timeB.nome;
                document.getElementById('btn-fechar-set-detalhe').innerText =
                    `${dados.timeA.placar}×${dados.timeB.placar} · ${vencedor || ''}`;
            }

            document.getElementById('btn-reabrir-set').classList.toggle('hidden', parciais.length === 0);

            const faixa = document.getElementById('parciais-mesa');
            faixa.innerHTML = '';
            parciais.forEach((p, i) => {
                const item = document.createElement('span');
                item.className = 'px-2 py-1 rounded-lg bg-gray-800 border border-gray-700 whitespace-nowrap';
                item.textContent = `${i + 1}º ${p.a}×${p.b}`;
                faixa.appendChild(item);
            });
        }

        function fecharSet() {
            socket.emit('comando_placar', { time: 'nenhum', acao: 'fechar_set', valor: 0 });
        }

        function reabrirSet() {
            if (!confirm('Reabrir o último set? O placar dele volta para o painel e o set sai da contagem.')) return;
            socket.emit('comando_placar', { time: 'nenhum', acao: 'reabrir_set', valor: 0 });
        }

        // Cronômetro crescente (MM:SS)
        setInterval(() => {
            if (!estadoAtual) return;
            const crono = estadoAtual.cronometro;
            let elapsed = crono.tempoAcumulado;
            if (crono.rodando) elapsed += (Date.now() - crono.inicioTimestamp);
            const totalSeg = Math.floor(elapsed / 1000);
            const min = Math.floor(totalSeg / 60);
            const seg = totalSeg % 60;
            document.getElementById('timer-display').innerText =
                `${String(min).padStart(2, '0')}:${String(seg).padStart(2, '0')}`;
        }, 500);

        function marcar(time) {
            const elenco = estadoAtual?.[time]?.elenco || [];
            if (elenco.length > 0) abrirModal(time, 'add_ponto', 1, elenco);
            else socket.emit('comando_placar', { time, acao: 'add_ponto', valor: 1 });
        }

        function cmdPlacar(time, acao, valor) {
            socket.emit('comando_placar', { time, acao, valor });
        }

        function abrirModal(time, acao, valor, elenco) {
            pendingAcao = { time, acao, valor };
            const titulos = { add_ponto: `+${valor} — Quem marcou?`, add_falta: 'Falta — Qual jogador?' };
            document.getElementById('modal-titulo').innerText = titulos[acao] || 'Selecione o jogador';
            const lista = document.getElementById('modal-lista');

            //TODO Order elenco by number
            //AQUI
            lista.innerHTML = '';
            elenco.forEach(j => {
                const btn = document.createElement('button');
                btn.className = 'bg-gray-700 active:bg-gray-600 active:scale-95 text-white rounded-xl py-4 px-2 flex flex-col items-center justify-center gap-1 transition-transform';
                btn.innerHTML = `<span class="font-black leading-none text-5xl">${j.numero || '—'}</span><span class="text-xs text-gray-300 truncate max-w-full">${(j.nome || '').replace(/</g, '&lt;')}</span>`;
                btn.onclick = () => confirmarComJogador(j);
                lista.appendChild(btn);
            });
            document.getElementById('modal-jogador').classList.remove('hidden');
        }

        function confirmarComJogador(jogador) {
            document.getElementById('modal-jogador').classList.add('hidden');
            if (!pendingAcao) return;
            socket.emit('comando_placar', { ...pendingAcao, jogador });
            pendingAcao = null;
        }

        function confirmarSemJogador() {
            document.getElementById('modal-jogador').classList.add('hidden');
            if (!pendingAcao) return;
            socket.emit('comando_placar', { ...pendingAcao });
            pendingAcao = null;
        }

        function cmdCronometro(acao) {
            socket.emit('comando_cronometro', { acao });
        }

        function zerarTudo() {
            if (confirm('Zerar placar e sets?')) {
                socket.emit('comando_placar', { time: 'nenhum', acao: 'zerar_tudo', valor: 0 });
            }
        }

        // Só desliga a transmissão do telão: não zera nada nem sai desta tela.
        function pararTransmissao() {
            if (confirm('Parar a transmissão do telão?')) {
                socket.emit('comando_transmissao', { ativa: false });
            }
        }
    </script>
</body>
</html>
