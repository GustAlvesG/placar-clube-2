<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placar</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
    </style>
</head>
<body>

    <!-- Animação de ponto / falta -->
    <div id="anim-overlay" style="display:none;position:fixed;inset:0;z-index:85;align-items:center;justify-content:center;pointer-events:none;">
        <div id="anim-card" style="background:rgba(0,0,0,0.88);padding:2.5rem 3.5rem;border-radius:1.5rem;text-align:center;min-width:18rem;">
            <div id="anim-time" style="color:#9ca3af;font-size:1.1rem;text-transform:uppercase;letter-spacing:0.15em;font-family:sans-serif;font-weight:700;margin-bottom:0.5rem;"></div>
            <div id="anim-acao" style="color:#facc15;font-size:5rem;font-weight:900;font-family:sans-serif;line-height:1;"></div>
            <div id="anim-jogador-box" style="display:flex;align-items:center;justify-content:center;gap:1.25rem;margin-top:1rem;">
                <img id="anim-foto" style="width:7rem;height:7rem;border-radius:9999px;object-fit:cover;border:4px solid #facc15;display:none;">
                <div id="anim-jogador-texto">
                    <div id="anim-numero" style="color:#facc15;font-size:3rem;font-weight:900;font-family:sans-serif;line-height:1;"></div>
                    <div id="anim-nome" style="color:#fff;font-size:2rem;font-weight:700;font-family:sans-serif;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Vídeo de apresentação do jogador em tela cheia (só na marcação de ponto).
         Fica acima do card de animação (85) e abaixo de standby/slides/comerciais,
         mantendo a mesma ordem de prioridade que a animação já tinha. -->
    <div id="anim-video-overlay" style="display:none;opacity:0;position:fixed;inset:0;z-index:88;background:#000;transition:opacity 600ms ease;">
        <video id="anim-video" style="width:100%;height:100%;object-fit:contain;background:#000;" playsinline></video>
    </div>

    <!-- Tela inicial / standby (visível até a transmissão ser iniciada) -->
    <div id="tela-inicial" style="position:fixed;inset:0;z-index:90;background:linear-gradient(to bottom,#490025 , #1D0518) ;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;">
        <div id="icone-esporte" style="font-size:9rem;line-height:1;">⚽</div>
        <h1 style="color:#fff;font-size:2.5rem;font-weight:900;letter-spacing:0.2em;text-transform:uppercase;font-family:sans-serif;">Clube dos Funcionários</h1>
        <p style="color:#6b7280;font-size:1.25rem;font-family:sans-serif;animation:pulse 2s infinite;">Aguardando transmissão...</p>
    </div>
    <style>
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
        @keyframes animPop {
            0%   { opacity:0; transform:scale(0.75) }
            12%  { opacity:1; transform:scale(1.05) }
            20%  { transform:scale(1) }
            80%  { opacity:1; transform:scale(1) }
            100% { opacity:0; transform:scale(0.9) }
        }
    </style>

    <!-- Player de vídeo para comerciais (sobrepõe tudo) -->
    <video id="videoPlayer" class="hidden" style="position:fixed;inset:0;width:100%;height:100%;z-index:100;background:#000;object-fit:contain;" playsinline></video>

    <!-- Apresentação de slides em tela cheia (fica abaixo do vídeo: um vídeo de comercial disparado durante os slides tem prioridade).
         Um slide pode ser uma imagem estática ou um vídeo (toca em loop até o operador avançar). -->
    <img id="slidePlayer" class="hidden" style="position:fixed;inset:0;width:100%;height:100%;z-index:95;background:#000;object-fit:contain;" alt="">
    <video id="slideVideoPlayer" class="hidden" style="position:fixed;inset:0;width:100%;height:100%;z-index:95;background:#000;object-fit:contain;" playsinline loop></video>
    <div id="slideIndicador" class="hidden" style="position:fixed;bottom:1.5rem;right:1.5rem;z-index:96;background:rgba(0,0,0,0.65);color:#fff;font-family:sans-serif;font-weight:700;font-size:1rem;padding:0.4rem 0.9rem;border-radius:0.75rem;"></div>

    <div class="placar-container">

        <div id="box" class="box"></div>

        <div id="element-1" class="element element-1"></div>
        <div id="element-2" class="element element-2"></div>

        <!-- Indicador de saque (vôlei): fundo + bola piscando ao lado do time sacando -->
        <div id="saque-A" class="saque-indicador">
            <div class="saque-fundo"></div>
            <div class="saque-bola"></div>
        </div>
        <div id="saque-B" class="saque-indicador">
            <div class="saque-fundo"></div>
            <div class="saque-bola"></div>
        </div>

        <div id="logos">
            <div class="logo logo-mandante flex items-center justify-center">
                <img id="logo-mandante" alt="Logo Mandante">
                <div id="sigla-mandante" class="hidden text-white font-bold text-5xl text-center w-full h-full flex items-center justify-center"></div>
            </div>
            <div class="logo logo-visitante flex items-center justify-center">
                <img id="logo-visitante" alt="Logo Visitante">
                <div id="sigla-visitante" class="hidden text-white font-bold text-5xl text-center w-full h-full flex items-center justify-center"></div>
            </div>
        </div>

        <div id="tempo" class="tempo"></div>

        <div id="nomes">
            <div id="nomeA" class="nome nome-mandante"></div>
            <div id="nomeB" class="nome nome-visitante"></div>
        </div>

        <div id="pontos">
            <div id="placarA" class="pontos pontos-mandante"></div>
            <div id="placarB" class="pontos pontos-visitante"></div>
        </div>

        <div id="area_quarter">
            <div class="quarter"></div>
            <div class="posse"></div>
        </div>

        <div id="area_fault">
            <div class="faltas-mandante"></div>
            <div class="periodo"></div>
            <div class="faltas-visitante"></div>
        </div>

        <div id="area_sets">
            <div id="setsA" class="volei sets sets-mandante"></div>
            <div id="setsT" class="volei sets sets-atual"></div>
            <div id="setsB" class="volei sets sets-visitante"></div>
        </div>
	<!-- Preenchido dinamicamente com as imagens de public/patrocinadores/ (via estado) -->
	<div class="sponsor-carousel-container" style="display:none;">
		<div class="sponsor-track" id="sponsorTrack"></div>
	</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let estadoLocal = null;

        // Lógica de Vídeo com playlist sequencial (com loop opcional)
        const videoPlayer = document.getElementById('videoPlayer');
        let videoQueue = [];
        let playlistOriginal = [];
        let playlistLoop = false;
        let tocouNoCiclo = false; // evita loop infinito se todos os vídeos falharem

        function pararReproducao() {
            videoQueue = [];
            playlistOriginal = [];
            playlistLoop = false;
            tocouNoCiclo = false;
            videoPlayer.pause();
            videoPlayer.src = '';
            videoPlayer.classList.add('hidden');
        }

        function playNext() {
            if (videoQueue.length === 0) {
                if (playlistLoop && playlistOriginal.length > 0 && tocouNoCiclo) {
                    videoQueue = [...playlistOriginal];
                    tocouNoCiclo = false;
                } else {
                    pararReproducao();
                    return;
                }
            }
            const arquivo = videoQueue.shift();
            videoPlayer.src = `/videos/${arquivo}`;
            videoPlayer.classList.remove('hidden');
            videoPlayer.load();
            videoPlayer.muted = false;
            videoPlayer.play().catch(() => {
                // Navegador bloqueou o autoplay com áudio: tenta o MESMO vídeo sem som.
                videoPlayer.muted = true;
                videoPlayer.play().catch((err) => {
                    console.error('Falha ao reproduzir o vídeo:', arquivo, err);
                    playNext();
                });
            });
        }

        socket.on('executar_video', (dados) => {
            if (dados.acao === 'playlist') {
                playlistOriginal = [...(dados.arquivos || [])];
                playlistLoop = !!dados.loop;
                tocouNoCiclo = false;
                videoQueue = [...playlistOriginal];
                playNext();
            } else if (dados.acao === 'play') {
                playlistOriginal = [dados.arquivo];
                playlistLoop = !!dados.loop;
                tocouNoCiclo = false;
                videoQueue = [...playlistOriginal];
                playNext();
            } else if (dados.acao === 'stop') {
                pararReproducao();
            }
        });

        videoPlayer.addEventListener('ended', () => { tocouNoCiclo = true; playNext(); });

        // Apresentação de slides: estado vem no broadcast (não é evento avulso),
        // para que um telão que reconecte no meio da apresentação sincronize sozinho.
        // Cada slide pode ser uma imagem (fica parada) ou um vídeo (toca em loop) até o operador avançar/recuar.
        const slidePlayer = document.getElementById('slidePlayer');
        const slideVideoPlayer = document.getElementById('slideVideoPlayer');
        const slideIndicador = document.getElementById('slideIndicador');
        const EXTENSOES_VIDEO_SLIDE = ['.mp4', '.webm', '.mov', '.avi', '.mkv'];
        function ehVideoSlide(nome) {
            const i = nome.lastIndexOf('.');
            return i >= 0 && EXTENSOES_VIDEO_SLIDE.includes(nome.slice(i).toLowerCase());
        }
        let slideArquivoAtual = '';
        function renderSlides(slides) {
            const ativo = !!(slides && slides.ativo && slides.arquivos && slides.arquivos.length > 0);
            if (!ativo) {
                slidePlayer.classList.add('hidden');
                slideVideoPlayer.classList.add('hidden');
                slideVideoPlayer.pause();
                slideIndicador.classList.add('hidden');
                slideArquivoAtual = '';
                return;
            }
            const arquivo = slides.arquivos[slides.indice] || slides.arquivos[0];
            if (arquivo !== slideArquivoAtual) {
                slideArquivoAtual = arquivo;
                const src = `slides/${encodeURIComponent(arquivo)}`;
                if (ehVideoSlide(arquivo)) {
                    slidePlayer.classList.add('hidden');
                    slideVideoPlayer.src = src;
                    slideVideoPlayer.classList.remove('hidden');
                    slideVideoPlayer.load();
                    slideVideoPlayer.muted = false;
                    slideVideoPlayer.play().catch(() => {
                        // Navegador bloqueou autoplay com áudio: toca o MESMO vídeo sem som.
                        slideVideoPlayer.muted = true;
                        slideVideoPlayer.play().catch((err) => console.error('Falha ao reproduzir slide em vídeo:', arquivo, err));
                    });
                } else {
                    slideVideoPlayer.pause();
                    slideVideoPlayer.classList.add('hidden');
                    slidePlayer.src = src;
                    slidePlayer.classList.remove('hidden');
                }
            }
            slideIndicador.innerText = `${slides.indice + 1} / ${slides.arquivos.length}`;
            slideIndicador.classList.remove('hidden');
        }

        // Animação de ponto / falta.
        //
        // Ponto COM vídeo do jogador  -> vídeo em tela cheia (fade in, toca até
        //                                o fim, fade out e volta pro placar).
        // Ponto sem vídeo / falta     -> card de sempre, com foto quando houver.
        // Falta nunca usa vídeo, mesmo que o jogador tenha um cadastrado.
        const FADE_VIDEO_JOGADOR_MS = 600;     // precisa casar com o transition do #anim-video-overlay
        const LIMITE_VIDEO_JOGADOR_MS = 30000; // trava de segurança: se o 'ended' não vier (stall de
                                               // rede, arquivo corrompido), o placar volta sozinho.

        function ocultarVideoJogador({ imediato = false } = {}) {
            const box = document.getElementById('anim-video-overlay');
            const videoEl = document.getElementById('anim-video');
            clearTimeout(window._animVideoTimer);
            clearTimeout(window._animVideoFadeTimer);

            const finalizar = () => {
                box.style.display = 'none';
                videoEl.pause();
                videoEl.removeAttribute('src');
                videoEl.load(); // encerra o download pendente
            };

            box.style.opacity = '0';
            if (imediato) return finalizar();
            window._animVideoFadeTimer = setTimeout(finalizar, FADE_VIDEO_JOGADOR_MS); // fade out
        }

        function mostrarVideoJogador(url, aoFalhar) {
            const box = document.getElementById('anim-video-overlay');
            const videoEl = document.getElementById('anim-video');

            clearTimeout(window._animVideoTimer);
            clearTimeout(window._animVideoFadeTimer);

            const falhar = () => {
                ocultarVideoJogador({ imediato: true });
                if (aoFalhar) aoFalhar(); // vídeo quebrado não anula o lance: cai pro card com foto
            };

            videoEl.onended = () => ocultarVideoJogador();
            videoEl.onerror = falhar;

            videoEl.src = url;
            videoEl.muted = false;

            box.style.display = 'block';
            box.offsetHeight;          // força reflow para o fade-in acontecer
            box.style.opacity = '1';

            videoEl.play().catch(() => {
                // Navegador bloqueou autoplay com áudio: toca o MESMO vídeo sem som.
                videoEl.muted = true;
                videoEl.play().catch((err) => {
                    console.error('Falha ao reproduzir vídeo do jogador:', err);
                    falhar();
                });
            });

            window._animVideoTimer = setTimeout(() => ocultarVideoJogador(), LIMITE_VIDEO_JOGADOR_MS);
        }

        function mostrarCardAnimacao(texto, timeNome, j) {
            document.getElementById('anim-time').innerText = timeNome || '';
            document.getElementById('anim-acao').innerText = texto || '';
            document.getElementById('anim-numero').innerText = j.numero ? '#' + j.numero : '';
            document.getElementById('anim-nome').innerText = j.nome || '';

            const fotoEl = document.getElementById('anim-foto');
            const textoEl = document.getElementById('anim-jogador-texto');
            if (j.foto) {
                fotoEl.src = j.foto;
                fotoEl.style.display = 'block';
                textoEl.style.textAlign = 'left';
            } else {
                fotoEl.style.display = 'none';
                fotoEl.src = '';
                textoEl.style.textAlign = 'center';
            }

            const overlay = document.getElementById('anim-overlay');
            const card = document.getElementById('anim-card');
            overlay.style.display = 'flex';
            card.style.animation = 'none';
            card.offsetHeight;
            card.style.animation = 'animPop 5s forwards';
            clearTimeout(window._animTimer);
            window._animTimer = setTimeout(() => { overlay.style.display = 'none'; }, 5000);
        }

        socket.on('animacao_ponto', ({ tipo, texto, jogador, timeNome }) => {
            // jogador pode ser objeto {numero, nome, foto, video} ou string (legado)
            const j = (jogador && typeof jogador === 'object') ? jogador : { numero: '', nome: jogador || '', foto: '', video: '' };

            if (tipo === 'ponto' && j.video) {
                // Lance novo durante um vídeo corta o card anterior na hora.
                document.getElementById('anim-overlay').style.display = 'none';
                clearTimeout(window._animTimer);
                mostrarVideoJogador(j.video, () => mostrarCardAnimacao(texto, timeNome, j));
                return;
            }

            ocultarVideoJogador({ imediato: true });
            mostrarCardAnimacao(texto, timeNome, j);
        });

        // Cronômetro em tempo real (50ms para suavidade nos centissegundos do basquete)
        setInterval(() => {
            if (!estadoLocal || !estadoLocal.cronometro) return;
            const crono = estadoLocal.cronometro;
            const esporte = estadoLocal.esporte;
            let elapsed = crono.tempoAcumulado;
            if (crono.rodando) elapsed += (Date.now() - crono.inicioTimestamp);

            let display = '';
            if (esporte === 'volei') {
                // Conta para cima: MM:SS
                const totalSeg = Math.floor(elapsed / 1000);
                const min = Math.floor(totalSeg / 60);
                const seg = totalSeg % 60;
                display = `${String(min).padStart(2, '0')}:${String(seg).padStart(2, '0')}`;
            } else if (esporte === 'futsal') {
                // Conta para baixo: MM:SS (sem centissegundos)
                const restante = Math.max(0, crono.duracaoConfigurada - elapsed);
                const min = Math.floor(restante / 60000);
                const seg = Math.floor((restante % 60000) / 1000);
                display = `${String(min).padStart(2, '0')}:${String(seg).padStart(2, '0')}`;
            } else if (esporte === 'basquete') {
                // Conta para baixo com centissegundos: MM:SS.cc
                const restante = Math.max(0, crono.duracaoConfigurada - elapsed);
                const min = Math.floor(restante / 60000);
                const seg = Math.floor((restante % 60000) / 1000);
                const cs = Math.floor((restante % 1000) / 10);
                display = `${String(min).padStart(2, '0')}:${String(seg).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
            }

            const tempoEl = document.getElementById('tempo');
            if (tempoEl && display) tempoEl.innerText = display;
        }, 50);

        // Carrossel de patrocinadores: o estado traz os nomes dos arquivos de
        // imagem em public/patrocinadores/ (gerenciados pela aba Anúncios).
        // A assinatura evita reconstruir o DOM (e reiniciar a animação CSS) a cada broadcast.
        let patrocinadoresAssinatura = null;
        function renderPatrocinadores(lista) {
            const nomes = Array.isArray(lista) ? lista : [];
            const assinatura = nomes.join('|');
            if (assinatura === patrocinadoresAssinatura) return;
            patrocinadoresAssinatura = assinatura;

            const container = document.querySelector('.sponsor-carousel-container');
            const track = document.getElementById('sponsorTrack');
            track.innerHTML = '';
            container.style.display = nomes.length ? '' : 'none';
            if (nomes.length === 0) return;

            const grupo = document.createElement('div');
            grupo.className = 'sponsor-group';
            nomes.forEach(nome => {
                const item = document.createElement('div');
                item.className = 'sponsor-item';
                const img = document.createElement('img');
                img.src = `patrocinadores/${encodeURIComponent(nome)}`;
                img.alt = nome.replace(/\.[^.]+$/, '');
                item.appendChild(img);
                grupo.appendChild(item);
            });
            track.appendChild(grupo);
        }

        // Atualização principal da tela
        socket.on('atualizar_tela', (dados) => {
            // Sincroniza relógio do cliente com servidor
            if (dados.serverTime && dados.cronometro) {
                const clockOffset = Date.now() - dados.serverTime;
                dados.cronometro.inicioTimestamp += clockOffset;
            }

            // Tela inicial: oculta quando transmissão está ativa
            const telaInicial = document.getElementById('tela-inicial');
            const icones = { futsal: '⚽', basquete: '🏀', volei: '🏐' };
            document.getElementById('icone-esporte').innerText = icones[dados.esporte] || '🏆';
            telaInicial.style.display = dados.transmissaoAtiva ? 'none' : 'flex';

            changeCssSport(dados.esporte);
            estadoLocal = dados;

            // Nomes
            document.getElementById('nomeA').innerText = dados.timeA.nome;
            document.getElementById('nomeB').innerText = dados.timeB.nome;

            // Placar (basquete sempre com 2 dígitos: 01, 02... 09, 10)
            const formatarPlacar = (p) => dados.esporte === 'basquete' ? String(p).padStart(2, '0') : p;
            document.getElementById('placarA').innerText = formatarPlacar(dados.timeA.placar);
            document.getElementById('placarB').innerText = formatarPlacar(dados.timeB.placar);

            // Sets (vôlei)
            document.getElementById('setsA').innerText = dados.timeA.sets;
            document.getElementById('setsB').innerText = dados.timeB.sets;

            // Faltas e período (futsal / basquete)
            document.querySelector('.faltas-mandante').innerText = dados.timeA.faltas ?? 0;
            document.querySelector('.faltas-visitante').innerText = dados.timeB.faltas ?? 0;
            document.querySelector('.periodo').innerText = dados.periodo ? `${dados.periodo}º` : '1º';

            // Logos / Siglas
            function getSigla(nome) {
                if (!nome) return "---";
                const palavras = nome.trim().split(/\s+/);
                if (palavras.length > 1) return palavras.slice(0, 3).map(p => p[0]).join('').toUpperCase();
                return nome.substring(0, 3).toUpperCase();
            }

            if (dados.timeA.logo) {
                document.getElementById('logo-mandante').src = dados.timeA.logo;
                document.getElementById('logo-mandante').classList.remove('hidden');
                document.getElementById('sigla-mandante').classList.add('hidden');
            } else {
                document.getElementById('logo-mandante').classList.add('hidden');
                document.getElementById('sigla-mandante').innerText = getSigla(dados.timeA.nome);
                document.getElementById('sigla-mandante').classList.remove('hidden');
            }

            if (dados.timeB.logo) {
                document.getElementById('logo-visitante').src = dados.timeB.logo;
                document.getElementById('logo-visitante').classList.remove('hidden');
                document.getElementById('sigla-visitante').classList.add('hidden');
            } else {
                document.getElementById('logo-visitante').classList.add('hidden');
                document.getElementById('sigla-visitante').innerText = getSigla(dados.timeB.nome);
                document.getElementById('sigla-visitante').classList.remove('hidden');
            }

            // Indicador de saque (vôlei)
            if (dados.esporte === 'volei') {
                document.getElementById('setsT').innerText = dados.timeA.sets + dados.timeB.sets + 1; // Exibe o número do set atual (soma dos sets + 1)
            } else {
                document.getElementById('setsT').innerText = '';
            }

            // Bola de saque piscando ao lado do time que está sacando (somente vôlei)
            const ehVolei = dados.esporte === 'volei';
            document.getElementById('saque-A').classList.toggle('ativo', ehVolei && dados.sacando === 'timeA');
            document.getElementById('saque-B').classList.toggle('ativo', ehVolei && dados.sacando === 'timeB');

            // Carrossel de patrocinadores
            renderPatrocinadores(dados.patrocinadores);

            // Apresentação de slides
            renderSlides(dados.slides);
        });

        function changeCssSport(sport) {
            const bola = document.getElementById("element-1");
            const logo = document.getElementById("element-2");
            const box = document.getElementById("box");

            const pontoMandante = document.querySelector(".pontos-mandante");
            const pontoVisitante = document.querySelector(".pontos-visitante");
            const nomeMandante = document.querySelector(".nome-mandante");
            const nomeVisitante = document.querySelector(".nome-visitante");
            const logoMandante = document.querySelector(".logo-mandante");
            const logoVisitante = document.querySelector(".logo-visitante");
            const tempo = document.querySelector(".tempo");

            const areaSets = document.getElementById("area_sets");
            const areaQuarter = document.getElementById("area_quarter");
            const areaFault = document.getElementById("area_fault");

            logo.style.backgroundImage = `url('./base/${sport}/element-2.png')`;
            bola.style.backgroundImage = `url('./base/${sport}/element-1.png')`;
            box.style.backgroundImage = `url('./base/${sport}/box.png')`;

            areaSets.hidden = true;
            areaQuarter.hidden = true;
            areaFault.hidden = true;

            const sportConfig = {
                volei: {
                    pontos: {
                        mandante: { top: "45.5%", left: "40.5%" },
                        visitante: { top: "45.5%", left: "59.2%" }
                    },
                    nomes: { top: "67%" },
                    tempo: { top: "19.5%", left: "50%" },
                    logo: {
                        mandante: { top: "45.5%", left: "18.4%" },
                        visitante: { top: "45.5%", left: "81.7%" }
                    },
                    extraArea: areaSets
                },
                basquete: {
                    pontos: {
                        mandante: { top: "56.5%", left: "40.5%" },
                        visitante: { top: "56.5%", left: "59.2%" }
                    },
                    nomes: { top: "80%" },
                    tempo: { top: "28.5%", left: "43%" },
