<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placar</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
    </style>
</head>
<body>

    <!-- Animação de ponto / falta: faixa grená atravessando a tela, na paleta
         do placar. Toda a sequência é disparada pela classe .ativo no overlay —
         ver o bloco "ANIMAÇÃO DE PONTO / FALTA" em style.css. -->
    <div id="anim-overlay">
        <div id="anim-faixa">
            <div id="anim-brilho"></div>
            <div id="anim-conteudo">
                <img id="anim-foto" alt="">
                <!-- Hierarquia: o jogador é o destaque, o clube vem depois e o
                     lance é só a etiqueta de cima. -->
                <div id="anim-jogador-texto">
                    <div id="anim-acao"></div>
                    <div id="anim-jogador-linha">
                        <span id="anim-numero"></span>
                        <span id="anim-nome"></span>
                    </div>
                    <div id="anim-time"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Fechamento de set/quarto e fim de jogo: mesma faixa grená da animação
         de ponto, mais alta, com o placar da parcial e mais tempo em cena.
         Ver "FECHAMENTO DE SET / JOGO" em style.css. -->
    <div id="set-overlay">
        <div id="set-faixa">
            <div id="set-brilho"></div>
            <div id="set-conteudo">
                <div id="set-kicker"></div>
                <div id="set-linhas">
                    <div class="set-linha" id="set-linha-a">
                        <span class="set-linha-nome"></span>
                        <span class="set-linha-pontos"></span>
                    </div>
                    <div class="set-linha" id="set-linha-b">
                        <span class="set-linha-nome"></span>
                        <span class="set-linha-pontos"></span>
                    </div>
                </div>
                <div id="set-rodape"></div>
            </div>
        </div>
    </div>

    <!-- Vídeo de apresentação do jogador em tela cheia (só na marcação de ponto).
         Fica acima do card de animação (85) e abaixo de standby/slides/comerciais,
         mantendo a mesma ordem de prioridade que a animação já tinha. -->
    <div id="anim-video-overlay" style="display:none;opacity:0;position:fixed;inset:0;z-index:88;background:#000;transition:opacity 600ms ease;">
        <video id="anim-video" style="width:100%;height:100%;object-fit:contain;background:#000;" playsinline></video>
    </div>

    <!-- Tela inicial / standby (visível até a transmissão ser iniciada) -->
    <div id="tela-inicial" style="position:fixed;inset:0;z-index:90;background:linear-gradient(to bottom,#490025 , #1D0518) ;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;">
        <div id="icone-esporte" style="font-size:9rem;line-height:1;">⚽</div>
        <h1 style="color:#fff;font-size:2.5rem;font-weight:900;letter-spacing:0.2em;text-transform:uppercase;font-family:sans-serif;">Clube dos Funcionários</h1>
        <p style="color:#6b7280;font-size:1.25rem;font-family:sans-serif;animation:pulse 2s infinite;">Aguardando transmissão...</p>
    </div>
    <style>
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    </style>

    <!-- Aviso discreto de áudio bloqueado: o vídeo TOCA de qualquer forma
         (mudo), isto só diz ao operador como recuperar o som. Ver o bloco
         "Autoplay sem clique" no script. -->
    <div id="aviso-som" style="display:none;position:fixed;bottom:1rem;left:1rem;z-index:110;background:rgba(0,0,0,0.75);color:#facc15;font-family:sans-serif;font-weight:700;font-size:0.9rem;padding:0.4rem 0.9rem;border-radius:0.75rem;">🔇 Som bloqueado pelo navegador — clique na tela para liberar</div>

    <!-- Player de vídeo para comerciais (sobrepõe tudo) -->
    <video id="videoPlayer" class="hidden" style="position:fixed;inset:0;width:100%;height:100%;z-index:100;background:#000;object-fit:contain;" playsinline></video>

    <!-- Apresentação de slides em tela cheia (fica abaixo do vídeo: um vídeo de comercial disparado durante os slides tem prioridade).
         Um slide pode ser uma imagem estática ou um vídeo (toca em loop até o operador avançar). -->
    <img id="slidePlayer" class="hidden" style="position:fixed;inset:0;width:100%;height:100%;z-index:95;background:#000;object-fit:contain;" alt="">
    <video id="slideVideoPlayer" class="hidden" style="position:fixed;inset:0;width:100%;height:100%;z-index:95;background:#000;object-fit:contain;" playsinline loop></video>
    <div id="slideIndicador" class="hidden" style="position:fixed;bottom:1.5rem;right:1.5rem;z-index:96;background:rgba(0,0,0,0.65);color:#fff;font-family:sans-serif;font-weight:700;font-size:1rem;padding:0.4rem 0.9rem;border-radius:0.75rem;"></div>

    <div class="placar-container">

        <div id="box" class="box"></div>

        <div id="element-1" class="element element-1"></div>
        <div id="element-2" class="element element-2"></div>

        <!-- Indicador de saque (vôlei): fundo + bola piscando ao lado do time sacando -->
        <div id="saque-A" class="saque-indicador">
            <div class="saque-fundo"></div>
            <div class="saque-bola"></div>
        </div>
        <div id="saque-B" class="saque-indicador">
            <div class="saque-fundo"></div>
            <div class="saque-bola"></div>
        </div>

        <div id="logos">
            <div class="logo logo-mandante flex items-center justify-center">
                <img id="logo-mandante" alt="Logo Mandante">
                <div id="sigla-mandante" class="hidden text-white font-bold text-5xl text-center w-full h-full flex items-center justify-center"></div>
            </div>
            <div class="logo logo-visitante flex items-center justify-center">
                <img id="logo-visitante" alt="Logo Visitante">
                <div id="sigla-visitante" class="hidden text-white font-bold text-5xl text-center w-full h-full flex items-center justify-center"></div>
            </div>
        </div>

        <div id="tempo" class="tempo"></div>

        <!-- SET POINT: o time está a um ponto de fechar a parcial. É um estado,
             não um evento — entra animado e fica pulsando enquanto durar, e só
             reanuncia quando troca de lado. Fica na faixa livre entre o TEMPO e
             os placares, alinhado sobre o número do time. Só vôlei (ver
             gameLogic.pontoDeParcial). -->
        <div id="set-point" class="set-point">SET POINT</div>

        <div id="nomes">
            <div id="nomeA" class="nome nome-mandante"></div>
            <div id="nomeB" class="nome nome-visitante"></div>
        </div>

        <div id="pontos">
            <div id="placarA" class="pontos pontos-mandante"></div>
            <div id="placarB" class="pontos pontos-visitante"></div>
        </div>

        <div id="area_quarter">
            <div class="quarter"></div>
            <div class="posse"></div>
        </div>

        <div id="area_fault">
            <div class="faltas-mandante"></div>
            <div class="periodo"></div>
            <div class="faltas-visitante"></div>
        </div>

        <!-- Sets vencidos por cada time (vôlei) -->
        <div id="area_sets">
            <div id="setsA" class="volei sets sets-mandante"></div>
            <div id="setsB" class="volei sets sets-visitante"></div>
        </div>

        <!-- Placar de cada parcial JÁ FECHADA: set no vôlei, quarto no
             basquete. Uma coluna por parcial, montada a partir de
             `state.parciais`; fica vazia enquanto nenhuma fechou. A parcial em
             disputa continua sendo o placar grande do meio. -->
        <div id="area_parciais">
            <div id="parciais" class="parciais"></div>
        </div>
	<!-- Preenchido dinamicamente com as imagens de public/patrocinadores/ (via estado) -->
	<div class="sponsor-carousel-container" style="display:none;">
		<div class="sponsor-track" id="sponsorTrack"></div>
	</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let estadoLocal = null;

        // ---- Autoplay sem clique -------------------------------------------
        // Política de autoplay do Chrome/Edge: vídeo COM áudio só toca depois de
        // um gesto do usuário na página; vídeo MUDO toca sempre. O telão antes
        // tentava com som, tomava NotAllowedError e só então caía pro mudo — e
        // nesse meio tempo o `load()` disparado logo antes do `play()` derrubava
        // a 2ª tentativa com AbortError ("interrupted by a new load request"),
        // deixando o vídeo parado até alguém clicar na tela.
        //
        // Agora todo vídeo entra por `tocarSemGesto()`, que começa MUDO
        // (permitido sempre, nunca precisa de clique) e só liga o som quando ele
        // já está autorizado — ligar sem autorização faz o navegador PAUSAR o
        // vídeo, que é justamente o sintoma a eliminar.
        //
        // `audioLiberado` vira true quando:
        //   • a sondagem consegue tocar áudio audível sozinha — é o caso quando o
        //     navegador do telão sobe com --autoplay-policy=no-user-gesture-required
        //     (ver "Telão em quiosque" no README), ou
        //   • houve qualquer gesto na página (clique/tecla/toque), que libera o
        //     áudio pelo resto da sessão.
        let audioLiberado = false;
        const videosGerenciados = [];

        // WAV mínimo em silêncio: conta como áudio audível para a política de
        // autoplay (não é `muted`), mas não faz barulho na sala.
        const WAV_SILENCIO = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';

        function atualizarAvisoSom() {
            const tocandoMudoAtoa = !audioLiberado && videosGerenciados.some(v => v.querSom && !v.el.paused);
            document.getElementById('aviso-som').style.display = tocandoMudoAtoa ? 'block' : 'none';
        }

        function liberarAudio() {
            if (audioLiberado) return;
            audioLiberado = true;
            // Vídeo que já está tocando mudo ganha som na hora.
            videosGerenciados.forEach(v => { if (v.querSom && !v.el.paused) v.el.muted = false; });
            atualizarAvisoSom();
        }

        ['pointerdown', 'keydown', 'touchstart'].forEach(evento =>
            window.addEventListener(evento, liberarAudio, { passive: true }));

        // Se o áudio já está autorizado (flag de quiosque, ou MEI alto por uso
        // recorrente), nem espera gesto.
        (function sondarAudio() {
            const som = new Audio(WAV_SILENCIO);
            som.play().then(() => { som.pause(); liberarAudio(); }).catch(() => { /* bloqueado: segue mudo */ });
        })();

        // Inicia a reprodução sem depender de gesto nenhum. `comSom: false` para
        // vídeo que deve ficar mudo de qualquer jeito.
        function tocarSemGesto(el, { comSom = true } = {}) {
            let registro = videosGerenciados.find(v => v.el === el);
            if (!registro) {
                registro = { el, querSom: comSom };
                videosGerenciados.push(registro);
                ['pause', 'ended', 'emptied'].forEach(ev => el.addEventListener(ev, atualizarAvisoSom));
            }
            registro.querSom = comSom;

            el.muted = comSom ? !audioLiberado : true;

            const tentar = () => el.play().then(() => atualizarAvisoSom());
            return tentar().catch(() => {
                // Sobrou alguma restrição (ou o play() foi cortado por um load()
                // concorrente): força mudo — que a política sempre permite — e
                // espera o elemento ter dados antes de insistir.
                el.muted = true;
                if (el.readyState >= 2) return tentar();
                return new Promise((resolve, reject) => {
                    const limpar = () => {
                        el.removeEventListener('loadeddata', ok);
                        el.removeEventListener('error', falhou);
                        clearTimeout(prazo);
                    };
                    const ok = () => { limpar(); tentar().then(resolve, reject); };
                    const falhou = () => { limpar(); reject(new Error('sem dados para reproduzir')); };
                    const prazo = setTimeout(falhou, 8000);
                    el.addEventListener('loadeddata', ok, { once: true });
                    el.addEventListener('error', falhou, { once: true });
                });
            });
        }

        // Lógica de Vídeo com playlist sequencial (com loop opcional)
        const videoPlayer = document.getElementById('videoPlayer');
        let videoQueue = [];
        let playlistOriginal = [];
        let playlistLoop = false;
        let tocouNoCiclo = false; // evita loop infinito se todos os vídeos falharem

        function pararReproducao() {
            videoQueue = [];
            playlistOriginal = [];
            playlistLoop = false;
            tocouNoCiclo = false;
            videoPlayer.pause();
            videoPlayer.src = '';
            videoPlayer.classList.add('hidden');
            atualizarAvisoSom();
        }

        function playNext() {
            if (videoQueue.length === 0) {
                if (playlistLoop && playlistOriginal.length > 0 && tocouNoCiclo) {
                    videoQueue = [...playlistOriginal];
                    tocouNoCiclo = false;
                } else {
                    pararReproducao();
                    return;
                }
            }
            const arquivo = videoQueue.shift();
            videoPlayer.src = `/videos/${arquivo}`;
            videoPlayer.classList.remove('hidden');
            // Sem load() aqui de propósito: atribuir `src` já dispara o
            // carregamento, e o load() extra cancelava o play() de baixo.
            tocarSemGesto(videoPlayer).catch((err) => {
                console.error('Falha ao reproduzir o vídeo:', arquivo, err);
                playNext();
            });
        }

        socket.on('executar_video', (dados) => {
            if (dados.acao === 'playlist') {
                playlistOriginal = [...(dados.arquivos || [])];
                playlistLoop = !!dados.loop;
                tocouNoCiclo = false;
                videoQueue = [...playlistOriginal];
                playNext();
            } else if (dados.acao === 'play') {
                playlistOriginal = [dados.arquivo];
                playlistLoop = !!dados.loop;
                tocouNoCiclo = false;
                videoQueue = [...playlistOriginal];
                playNext();
            } else if (dados.acao === 'stop') {
                pararReproducao();
            }
        });

        videoPlayer.addEventListener('ended', () => { tocouNoCiclo = true; playNext(); });

        // Apresentação de slides: estado vem no broadcast (não é evento avulso),
        // para que um telão que reconecte no meio da apresentação sincronize sozinho.
        // Cada slide pode ser uma imagem (fica parada) ou um vídeo (toca em loop) até o operador avançar/recuar.
        const slidePlayer = document.getElementById('slidePlayer');
        const slideVideoPlayer = document.getElementById('slideVideoPlayer');
        const slideIndicador = document.getElementById('slideIndicador');
        const EXTENSOES_VIDEO_SLIDE = ['.mp4', '.webm', '.mov', '.avi', '.mkv'];
        function ehVideoSlide(nome) {
            const i = nome.lastIndexOf('.');
            return i >= 0 && EXTENSOES_VIDEO_SLIDE.includes(nome.slice(i).toLowerCase());
        }
        let slideArquivoAtual = '';
        function renderSlides(slides) {
            const ativo = !!(slides && slides.ativo && slides.arquivos && slides.arquivos.length > 0);
            if (!ativo) {
                slidePlayer.classList.add('hidden');
                slideVideoPlayer.classList.add('hidden');
                slideVideoPlayer.pause();
                slideIndicador.classList.add('hidden');
                slideArquivoAtual = '';
                return;
            }
            const arquivo = slides.arquivos[slides.indice] || slides.arquivos[0];
            if (arquivo !== slideArquivoAtual) {
                slideArquivoAtual = arquivo;
                const src = `slides/${encodeURIComponent(arquivo)}`;
                if (ehVideoSlide(arquivo)) {
                    slidePlayer.classList.add('hidden');
                    slideVideoPlayer.src = src;
                    slideVideoPlayer.classList.remove('hidden');
                    tocarSemGesto(slideVideoPlayer).catch((err) => console.error('Falha ao reproduzir slide em vídeo:', arquivo, err));
                } else {
                    slideVideoPlayer.pause();
                    slideVideoPlayer.classList.add('hidden');
                    slidePlayer.src = src;
                    slidePlayer.classList.remove('hidden');
                }
            }
            slideIndicador.innerText = `${slides.indice + 1} / ${slides.arquivos.length}`;
            slideIndicador.classList.remove('hidden');
        }

        // Animação de ponto / falta.
        //
        // Ponto COM vídeo do jogador  -> vídeo em tela cheia (fade in, toca até
        //                                o fim, fade out e volta pro placar).
        // Ponto sem vídeo / falta     -> card de sempre, com foto quando houver.
        // Falta nunca usa vídeo, mesmo que o jogador tenha um cadastrado.
        const FADE_VIDEO_JOGADOR_MS = 600;     // precisa casar com o transition do #anim-video-overlay
        const LIMITE_VIDEO_JOGADOR_MS = 30000; // trava de segurança: se o 'ended' não vier (stall de
                                               // rede, arquivo corrompido), o placar volta sozinho.

        function ocultarVideoJogador({ imediato = false } = {}) {
            const box = document.getElementById('anim-video-overlay');
            const videoEl = document.getElementById('anim-video');
            clearTimeout(window._animVideoTimer);
            clearTimeout(window._animVideoFadeTimer);

            const finalizar = () => {
                box.style.display = 'none';
                videoEl.pause();
                videoEl.removeAttribute('src');
                videoEl.load(); // encerra o download pendente
            };

            box.style.opacity = '0';
            if (imediato) return finalizar();
            window._animVideoFadeTimer = setTimeout(finalizar, FADE_VIDEO_JOGADOR_MS); // fade out
        }

        function mostrarVideoJogador(url, aoFalhar) {
            const box = document.getElementById('anim-video-overlay');
            const videoEl = document.getElementById('anim-video');

            clearTimeout(window._animVideoTimer);
            clearTimeout(window._animVideoFadeTimer);

            // `onerror` do elemento e a rejeição de `tocarSemGesto` podem
            // chegar os dois pelo mesmo problema — o card só pode aparecer uma vez.
            let jaFalhou = false;
            const falhar = () => {
                if (jaFalhou) return;
                jaFalhou = true;
                ocultarVideoJogador({ imediato: true });
                if (aoFalhar) aoFalhar(); // vídeo quebrado não anula o lance: cai pro card com foto
            };

            videoEl.onended = () => ocultarVideoJogador();
            videoEl.onerror = falhar;

            videoEl.src = url;

            box.style.display = 'block';
            box.offsetHeight;          // força reflow para o fade-in acontecer
            box.style.opacity = '1';

            tocarSemGesto(videoEl).catch((err) => {
                console.error('Falha ao reproduzir vídeo do jogador:', err);
                falhar();
            });

            window._animVideoTimer = setTimeout(() => ocultarVideoJogador(), LIMITE_VIDEO_JOGADOR_MS);
        }

        // Faixa de ponto/falta. O CSS cuida da coreografia inteira; aqui só
        // entram o conteúdo, as duas variações de layout (com/sem foto, ponto/
        // falta) e o reinício — pontos chegam em rajada e o lance novo tem que
        // cortar o anterior.
        const ANIM_DURACAO = 5000; // igual ao total do keyframe anim-faixa
        function mostrarCardAnimacao(texto, timeNome, j, tipo) {
            document.getElementById('anim-time').innerText = timeNome || '';
            document.getElementById('anim-acao').innerText = texto || '';
            document.getElementById('anim-numero').innerText = j.numero ? '#' + j.numero : '';
            document.getElementById('anim-nome').innerText = j.nome || '';

            const fotoEl = document.getElementById('anim-foto');
            if (j.foto) {
                fotoEl.src = j.foto;
            } else {
                // removeAttribute (e não src=''): src vazio faria o navegador
                // pedir a própria página como imagem.
                fotoEl.removeAttribute('src');
            }

            const overlay = document.getElementById('anim-overlay');
            overlay.classList.toggle('sem-foto', !j.foto);
            // Falta não é comemoração: mesma faixa, tons apagados e sem brilho.
            overlay.classList.toggle('anim-falta', tipo === 'falta');

            overlay.classList.remove('ativo');
            overlay.offsetHeight; // reflow: reinicia a sequência inteira
            overlay.classList.add('ativo');

            clearTimeout(window._animTimer);
            window._animTimer = setTimeout(() => overlay.classList.remove('ativo'), ANIM_DURACAO);
        }

        socket.on('animacao_ponto', ({ tipo, texto, jogador, timeNome }) => {
            // jogador pode ser objeto {numero, nome, foto, video} ou string (legado)
            const j = (jogador && typeof jogador === 'object') ? jogador : { numero: '', nome: jogador || '', foto: '', video: '' };

            if (tipo === 'ponto' && j.video) {
                // Lance novo durante um vídeo corta o card anterior na hora.
                document.getElementById('anim-overlay').classList.remove('ativo');
                clearTimeout(window._animTimer);
                mostrarVideoJogador(j.video, () => mostrarCardAnimacao(texto, timeNome, j, tipo));
                return;
            }

            ocultarVideoJogador({ imediato: true });
            mostrarCardAnimacao(texto, timeNome, j, tipo);
        });

        // Fechamento de parcial (e fim de jogo). Tudo vem no payload: o
        // `atualizar_tela` chega depois do anúncio e já com o placar zerado.
        const SET_DURACAO = 9000; // igual ao total do keyframe set-faixa
        socket.on('animacao_parcial', (d) => {
            document.getElementById('set-kicker').innerText =
                d.tipo === 'jogo' ? 'FIM DE JOGO' : `${d.numero}º ${d.rotulo}`;

            const linha = (id, nome, pontos, venceu) => {
                const el = document.getElementById(id);
                el.querySelector('.set-linha-nome').innerText = nome || '';
                el.querySelector('.set-linha-pontos').innerText = pontos;
                el.classList.toggle('venceu', venceu);
            };
            linha('set-linha-a', d.times.a, d.placar.a, d.vencedor === 'timeA');
            linha('set-linha-b', d.times.b, d.placar.b, d.vencedor === 'timeB');

            // SET -> SETS, QUARTO -> QUARTOS
            document.getElementById('set-rodape').innerText =
                `${d.rotulo}S   ${d.sets.a}   ×   ${d.sets.b}`;

            // O fechamento manda em cena: corta a faixa de ponto e o vídeo do lance.
            document.getElementById('anim-overlay').classList.remove('ativo');
            clearTimeout(window._animTimer);
            ocultarVideoJogador({ imediato: true });

            const overlay = document.getElementById('set-overlay');
            overlay.classList.toggle('fim-de-jogo', d.tipo === 'jogo');
            overlay.classList.remove('ativo');
            overlay.offsetHeight; // reflow: reinicia a sequência inteira
            overlay.classList.add('ativo');

            clearTimeout(window._setTimer);
            window._setTimer = setTimeout(() => overlay.classList.remove('ativo'), SET_DURACAO);
        });

        // Cronômetro em tempo real (50ms para suavidade nos centissegundos do basquete)
        setInterval(() => {
            if (!estadoLocal || !estadoLocal.cronometro) return;
            const crono = estadoLocal.cronometro;
            const esporte = estadoLocal.esporte;
            let elapsed = crono.tempoAcumulado;
            if (crono.rodando) elapsed += (Date.now() - crono.inicioTimestamp);

            let display = '';
            if (esporte === 'volei') {
                // Conta para cima: MM:SS
                const totalSeg = Math.floor(elapsed / 1000);
                const min = Math.floor(totalSeg / 60);
                const seg = totalSeg % 60;
                display = `${String(min).padStart(2, '0')}:${String(seg).padStart(2, '0')}`;
            } else if (esporte === 'futsal') {
                // Conta para baixo: MM:SS (sem centissegundos)
                const restante = Math.max(0, crono.duracaoConfigurada - elapsed);
                const min = Math.floor(restante / 60000);
                const seg = Math.floor((restante % 60000) / 1000);
                display = `${String(min).padStart(2, '0')}:${String(seg).padStart(2, '0')}`;
            } else if (esporte === 'basquete') {
                // Conta para baixo com centissegundos: MM:SS.cc
                const restante = Math.max(0, crono.duracaoConfigurada - elapsed);
                const min = Math.floor(restante / 60000);
                const seg = Math.floor((restante % 60000) / 1000);
                const cs = Math.floor((restante % 1000) / 10);
                display = `${String(min).padStart(2, '0')}:${String(seg).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
            }

            const tempoEl = document.getElementById('tempo');
            if (tempoEl && display) tempoEl.innerText = display;
        }, 50);

        // Carrossel de patrocinadores: o estado traz os nomes dos arquivos de
        // imagem em public/patrocinadores/ (gerenciados pela aba Anúncios).
        // A assinatura evita reconstruir o DOM (e reiniciar a animação CSS) a cada broadcast.
        let patrocinadoresAssinatura = null;
        function renderPatrocinadores(lista) {
            const nomes = Array.isArray(lista) ? lista : [];
            const assinatura = nomes.join('|');
            if (assinatura === patrocinadoresAssinatura) return;
            patrocinadoresAssinatura = assinatura;

            const container = document.querySelector('.sponsor-carousel-container');
            const track = document.getElementById('sponsorTrack');
            track.innerHTML = '';
            container.style.display = nomes.length ? '' : 'none';
            if (nomes.length === 0) return;

            const grupo = document.createElement('div');
            grupo.className = 'sponsor-group';
            nomes.forEach(nome => {
                const item = document.createElement('div');
                item.className = 'sponsor-item';
                const img = document.createElement('img');
                img.src = `patrocinadores/${encodeURIComponent(nome)}`;
                img.alt = nome.replace(/\.[^.]+$/, '');
                item.appendChild(img);
                grupo.appendChild(item);
            });
            track.appendChild(grupo);
        }

        // Faixa set a set (quarto a quarto no basquete). A grade inteira fica
        // sempre à vista: as parciais fechadas com o resultado final, a que está
        // em disputa com o placar ao vivo e as que ainda não começaram com um
        // traço. A assinatura evita reconstruir o DOM a cada broadcast (chega um
        // por ponto marcado) — e por isso inclui o placar ao vivo.
        let parciaisAssinatura = null;
        function renderParciais(dados) {
            const fechadas = Array.isArray(dados.parciais) ? dados.parciais : [];
            const total = dados.totalParciais || fechadas.length;
            const emAndamento = dados.parcialEmAndamento || null;

            const assinatura = [
                total, emAndamento,
                fechadas.map(p => `${p.a}x${p.b}`).join('|'),
                dados.timeA.placar, dados.timeB.placar
            ].join('/');
            if (assinatura === parciaisAssinatura) return;
            parciaisAssinatura = assinatura;

            const alvo = document.getElementById('parciais');
            alvo.innerHTML = '';

            for (let numero = 1; numero <= total; numero++) {
                const fechada = fechadas[numero - 1] || null;
                const atual = !fechada && numero === emAndamento;

                const coluna = document.createElement('div');
                coluna.className = 'parcial'
                    + (atual ? ' parcial-atual' : '')
                    + (!fechada && !atual ? ' parcial-vazia' : '');

                const rotulo = document.createElement('div');
                rotulo.className = 'parcial-rotulo';
                rotulo.textContent = `${numero}º`;
                coluna.appendChild(rotulo);

                // Fechada: resultado final, com quem levou em destaque.
                // Em disputa: placar ao vivo, sem destaque (ninguém venceu ainda).
                // Ainda não começou: travessão.
                const linhas = fechada
                    ? [[fechada.a, fechada.a > fechada.b], [fechada.b, fechada.b > fechada.a]]
                    : atual
                        ? [[dados.timeA.placar, false], [dados.timeB.placar, false]]
                        : [['–', false], ['–', false]];

                // textContent (e não innerHTML): o placar vem do estado, não é
                // lugar de interpretar marcação.
                linhas.forEach(([valor, venceu]) => {
                    const ponto = document.createElement('div');
                    ponto.className = venceu ? 'parcial-ponto parcial-venceu' : 'parcial-ponto';
                    ponto.textContent = valor;
                    coluna.appendChild(ponto);
                });

                alvo.appendChild(coluna);
            }
        }

        // Nome do time em UMA linha só, sem virar letra de bula. A ordem é:
        // encolher a fonte até um piso legível, depois condensar as letras (que
        // custa menos legibilidade que diminuir mais) e, só num nome absurdo que
        // nem assim caiba, cortar com reticências — melhor um nome cortado e
        // legível do que a linha inteira ilegível.
        // A conta sai em cqw, que escala junto com o container: coube uma vez,
        // cabe em qualquer resolução de telão.
        const NOME_FONTE_MAX = 2.5;   // cqw — tamanho de projeto
        const NOME_FONTE_MIN = 1.4;   // cqw — piso de legibilidade
        const NOME_APERTO_MAX = 0.8;  // até 20% de condensação horizontal
        function ajustarNome(el, texto) {
            const valor = texto || '';
            if (el.dataset.nome === valor) return;
            el.dataset.nome = valor;

            let span = el.firstElementChild;
            if (!span) {
                span = document.createElement('span');
                el.appendChild(span);
            }
            span.textContent = valor;
            span.style.transform = 'none';
            span.style.maxWidth = '';
            span.classList.remove('nome-cortado');
            el.style.fontSize = NOME_FONTE_MAX + 'cqw';

            const disponivel = el.getBoundingClientRect().width;
            const largura = () => span.getBoundingClientRect().width;
            if (!disponivel || largura() <= disponivel) return;

            // 1) encolhe a fonte, proporcionalmente ao excesso, até o piso
            el.style.fontSize = Math.max(NOME_FONTE_MIN, NOME_FONTE_MAX * disponivel / largura()) + 'cqw';

            // 2) o que faltar vira condensação, limitada
            const escala = Math.max(NOME_APERTO_MAX, disponivel / largura());
            if (escala >= 1) return;
            span.style.transform = `scaleX(${escala})`;

            // 3) nem no piso coube: corta com reticências (a largura é medida
            //    antes da condensação, por isso dividida pela escala)
            if (largura() * escala > disponivel) {
                span.style.maxWidth = (disponivel / escala) + 'px';
                span.classList.add('nome-cortado');
            }
        }

        // SET POINT — a animação de entrada só roda quando o estado MUDA
        // (apareceu, sumiu ou trocou de time). Sem essa guarda ela recomeçaria a
        // cada broadcast, e chega um por ponto marcado.
        let setPointAtual = null;
        function renderSetPoint(time) {
            const alvo = time || null;
            if (alvo === setPointAtual) return;
            setPointAtual = alvo;

            const el = document.getElementById('set-point');
            el.classList.remove('ativo', 'set-point-mandante', 'set-point-visitante');
            if (!alvo) return;

            el.offsetHeight; // reflow: força a animação de entrada a rodar de novo
            el.classList.add('ativo', alvo === 'timeA' ? 'set-point-mandante' : 'set-point-visitante');
        }

        // Atualização principal da tela
        socket.on('atualizar_tela', (dados) => {
            // Sincroniza relógio do cliente com servidor
            if (dados.serverTime && dados.cronometro) {
                const clockOffset = Date.now() - dados.serverTime;
                dados.cronometro.inicioTimestamp += clockOffset;
            }

            // Tela inicial: oculta quando transmissão está ativa
            const telaInicial = document.getElementById('tela-inicial');
            const icones = { futsal: '⚽', basquete: '🏀', volei: '🏐' };
            document.getElementById('icone-esporte').innerText = icones[dados.esporte] || '🏆';
            telaInicial.style.display = dados.transmissaoAtiva ? 'none' : 'flex';

            changeCssSport(dados.esporte);
            estadoLocal = dados;

            // Nomes (sempre em uma linha só — ver ajustarNome)
            ajustarNome(document.getElementById('nomeA'), dados.timeA.nome);
            ajustarNome(document.getElementById('nomeB'), dados.timeB.nome);

            // Placar (basquete sempre com 2 dígitos: 01, 02... 09, 10)
            const formatarPlacar = (p) => dados.esporte === 'basquete' ? String(p).padStart(2, '0') : p;
            document.getElementById('placarA').innerText = formatarPlacar(dados.timeA.placar);
            document.getElementById('placarB').innerText = formatarPlacar(dados.timeB.placar);

            // Sets (vôlei)
            document.getElementById('setsA').innerText = dados.timeA.sets;
            document.getElementById('setsB').innerText = dados.timeB.sets;

            // Faltas e período (futsal / basquete)
            document.querySelector('.faltas-mandante').innerText = dados.timeA.faltas ?? 0;
            document.querySelector('.faltas-visitante').innerText = dados.timeB.faltas ?? 0;
            document.querySelector('.periodo').innerText = dados.periodo ? `${dados.periodo}º` : '1º';

            // Logos / Siglas
            function getSigla(nome) {
                if (!nome) return "---";
                const palavras = nome.trim().split(/\s+/);
                if (palavras.length > 1) return palavras.slice(0, 3).map(p => p[0]).join('').toUpperCase();
                return nome.substring(0, 3).toUpperCase();
            }

            if (dados.timeA.logo) {
                document.getElementById('logo-mandante').src = dados.timeA.logo;
                document.getElementById('logo-mandante').classList.remove('hidden');
                document.getElementById('sigla-mandante').classList.add('hidden');
            } else {
                document.getElementById('logo-mandante').classList.add('hidden');
                document.getElementById('sigla-mandante').innerText = getSigla(dados.timeA.nome);
                document.getElementById('sigla-mandante').classList.remove('hidden');
            }

            if (dados.timeB.logo) {
                document.getElementById('logo-visitante').src = dados.timeB.logo;
                document.getElementById('logo-visitante').classList.remove('hidden');
                document.getElementById('sigla-visitante').classList.add('hidden');
            } else {
                document.getElementById('logo-visitante').classList.add('hidden');
                document.getElementById('sigla-visitante').innerText = getSigla(dados.timeB.nome);
                document.getElementById('sigla-visitante').classList.remove('hidden');
            }

            // Set point (null fora do vôlei, e também quando a pontuação já
            // fecha a parcial — aí o que vale é o botão de fechar na mesa)
            renderSetPoint(dados.setPoint);

            // Parciais já fechadas (o campo "set atual" do layout antigo saiu:
            // o set em disputa é o próprio placar grande).
            renderParciais(dados);

            // Bola de saque piscando ao lado do time que está sacando (somente vôlei)
            const ehVolei = dados.esporte === 'volei';
            document.getElementById('saque-A').classList.toggle('ativo', ehVolei && dados.sacando === 'timeA');
            document.getElementById('saque-B').classList.toggle('ativo', ehVolei && dados.sacando === 'timeB');

            // Carrossel de patrocinadores
            renderPatrocinadores(dados.patrocinadores);

            // Apresentação de slides
            renderSlides(dados.slides);
        });

        function changeCssSport(sport) {
            const bola = document.getElementById("element-1");
            const logo = document.getElementById("element-2");
            const box = document.getElementById("box");

            const pontoMandante = document.querySelector(".pontos-mandante");
            const pontoVisitante = document.querySelector(".pontos-visitante");
            const nomeMandante = document.querySelector(".nome-mandante");
            const nomeVisitante = document.querySelector(".nome-visitante");
            const logoMandante = document.querySelector(".logo-mandante");
            const logoVisitante = document.querySelector(".logo-visitante");
            const tempo = document.querySelector(".tempo");

            const areaSets = document.getElementById("area_sets");
            const areaParciais = document.getElementById("area_parciais");
            const areaQuarter = document.getElementById("area_quarter");
            const areaFault = document.getElementById("area_fault");

            logo.style.backgroundImage = `url('./base/${sport}/element-2.png')`;
            bola.style.backgroundImage = `url('./base/${sport}/element-1.png')`;
            box.style.backgroundImage = `url('./base/${sport}/box.png')`;

            areaSets.hidden = true;
            areaParciais.hidden = true;
            areaQuarter.hidden = true;
            areaFault.hidden = true;

            const sportConfig = {
                volei: {
                    pontos: {
                        mandante: { top: "45.5%", left: "40.5%" },
                        visitante: { top: "45.5%", left: "59.2%" }
                    },
                    nomes: { top: "67%" },
                    tempo: { top: "19.5%", left: "50%" },
                    logo: {
                        mandante: { top: "45.5%", left: "18.4%" },
                        visitante: { top: "45.5%", left: "81.7%" }
                    },
                    extraAreas: [areaSets, areaParciais]
                },
                basquete: {
                    pontos: {
                        mandante: { top: "56.5%", left: "40.5%" },
                        visitante: { top: "56.5%", left: "59.2%" }
                    },
                    nomes: { top: "80%" },
                    tempo: { top: "28.5%", left: "43%" },
                    logo: {
                        mandante: { top: "58.8%", left: "18.4%" },
                        visitante: { top: "58.8%", left: "81.7%" }
                    },
                    // Para ligar as parciais por quarto no basquete, basta
                    // `[areaFault, areaParciais]` aqui — a lógica
                    // (fechar_set/reabrir_set, REGRAS_PARCIAL.basquete) e o
                    // render já atendem os dois esportes; falta a mesa de
                    // basquete ter o botão de fechar o quarto.
                    extraAreas: [areaFault]
                },
                futsal: {
                    pontos: {
                        mandante: { top: "56.5%", left: "40.5%" },
                        visitante: { top: "56.5%", left: "59.2%" }
                    },
                    nomes: { top: "80.5%" },
                    tempo: { top: "28.5%", left: "43%" },
                    logo: {
                        mandante: { top: "58.8%", left: "18.4%" },
                        visitante: { top: "58.8%", left: "81.7%" }
                    },
                    extraAreas: [areaFault]
                }
            };

            const config = sportConfig[sport];
            if (!config) { console.warn(`Esporte "${sport}" não configurado.`); return; }

            pontoMandante.style.top = config.pontos.mandante.top;
            pontoMandante.style.left = config.pontos.mandante.left;
            pontoVisitante.style.top = config.pontos.visitante.top;
            pontoVisitante.style.left = config.pontos.visitante.left;

            logoMandante.style.top = config.logo.mandante.top;
            logoMandante.style.left = config.logo.mandante.left;
            logoVisitante.style.top = config.logo.visitante.top;
            logoVisitante.style.left = config.logo.visitante.left;

            nomeMandante.style.top = config.nomes.top;
            nomeVisitante.style.top = config.nomes.top;

            tempo.style.top = config.tempo.top;
            tempo.style.left = config.tempo.left;

            config.extraAreas.forEach(area => { area.hidden = false; });
        }
    </script>
</body>
</html>
